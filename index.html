<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A6B4B">
<title>Mbootaay – tontines et associations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F1;--ink:#13241B;--mut:#5A6B61;--g:#0A6B4B;--y:#F4B400;--r:#C23A2B;--line:#D5DED6;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:clamp(28px,7vw,44px);line-height:1.05;font-weight:800;margin:8px 0 12px;letter-spacing:-.02em}
h3{margin:22px 0 8px}
button,.btn{font:inherit;font-weight:600;background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}
button.sm{padding:5px 10px;font-size:14px}
button.red{background:var(--r)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{font-weight:800;font-size:22px;color:var(--g);cursor:pointer;border-bottom:4px solid var(--y)}
.hero p{max-width:52ch;color:var(--mut);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--ink);line-height:1.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.card h2{margin:0 0 2px;font-size:19px}
.card small,.mut{color:var(--mut)}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:600;background:#E4F1EA;color:var(--g)}
.badge.late{background:#F9E2DF;color:var(--r)}
.badge.t{background:#FFF1C2;color:#7A5A00}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;color:var(--mut);border-radius:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap}
.tabs button.on{color:var(--g);border-color:var(--g)}
.row2{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;flex-wrap:wrap}
.grow{flex:1;min-width:140px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.rk{width:26px;height:26px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:800;font-size:13px}
.pot{background:var(--g);color:#fff;border-radius:16px;padding:18px;margin:8px 0}
.pot b{display:block;font-size:34px;line-height:1.1}
.pot button{background:var(--y);color:var(--ink);margin-top:6px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--mut)}
.sum b{display:block;font-size:16px;color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
em{font-style:normal;background:var(--y);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0007}
dialog label{display:block;font-size:14px;color:var(--mut);margin:10px 0}
dialog input,dialog select{display:block;width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:8px;margin-top:4px;color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media print{.tabs,.acts,button,footer,.top{display:none!important}body{background:#fff}.row2,.card{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><span class="brand" data-a="home" tabindex="0" role="button">Mbootaay</span><span id="sub" class="mut"></span></div>
  <div id="app"></div>
</main>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const $=s=>document.querySelector(s);
let S={groups:[]},cur=null,tab='membres';
try{S=JSON.parse(localStorage.getItem('mbootaay')||'')||S}catch(e){}
const save=()=>{try{localStorage.setItem('mbootaay',JSON.stringify(S))}catch(e){toast('Enregistrement impossible : stockage du navigateur indisponible.')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const f=n=>Math.round(n).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ')+' FCFA';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dfr=d=>new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
const G=()=>S.groups.find(x=>x.id==cur);
function nP(g){const a=new Date(g.start),b=new Date();let n;
  if(g.freq=='mois')n=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1;
  else if(g.freq=='an')n=b.getFullYear()-a.getFullYear()+1;
  else n=Math.floor((b-a)/6048e5)+1;
  return Math.max(1,n)}
const paid=(g,id)=>g.payments.filter(p=>p.mid==id).reduce((s,p)=>s+p.amount,0);
const due=(g,m)=>g.amount*nP(g)-paid(g,m.id);
const coll=g=>g.payments.reduce((s,p)=>s+p.amount,0);
const ord=g=>{g.order=g.order.filter(i=>g.members.some(m=>m.id==i));g.members.forEach(m=>{if(!g.order.includes(m.id))g.order.push(m.id)});return g.order};
const mem=(g,id)=>g.members.find(m=>m.id==id);
function wa(p,t){let n=String(p||'').replace(/\D/g,'');if(n.length==9)n='221'+n;return `https://wa.me/${n}?text=${encodeURIComponent(t)}`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function modal(t,fs,ok){
  const d=document.createElement('dialog');
  d.innerHTML=`<h3 style="margin-top:0">${t}</h3>`+fs.map(x=>`<label>${x.l}${x.t=='select'
    ?`<select name="${x.k}">${x.o.map(o=>`<option value="${o[0]}"${o[0]==x.v?' selected':''}>${o[1]}</option>`).join('')}</select>`
    :`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v??'')}"${x.p?` placeholder="${x.p}"`:''}${x.t=='number'?' min="0" inputmode="numeric"':''}>`}</label>`).join('')
    +`<div class="row"><button class="ghost" data-c>Annuler</button><button data-o>Enregistrer</button></div>`;
  document.body.append(d);d.showModal();
  const end=()=>{d.close();d.remove()};
  d.querySelector('[data-c]').onclick=end;
  d.querySelector('[data-o]').onclick=()=>{const v={};d.querySelectorAll('[name]').forEach(i=>v[i.name]=i.value.trim());if(ok(v)!==false)end()};
}

/* ---------- Vues ---------- */
function home(){
  const gs=S.groups,tot=gs.reduce((a,g)=>a+coll(g),0),late=gs.reduce((a,g)=>a+g.members.filter(m=>due(g,m)>0).length,0);
  return `<section class="hero"><h1>Vos cotisations, claires pour tout le monde.</h1>
  <p>Tontines, dahiras, associations et clubs : suivez qui a payé, relancez par WhatsApp et remettez la cagnotte au bon tour.</p>
  <button data-a="newg">Créer un groupe</button></section>
  <div class="stats"><div><b>${gs.length}</b>groupes</div><div><b>${f(tot)}</b>collectés</div><div><b>${late}</b>membres en retard</div></div>
  ${gs.length?gs.map(g=>{const l=g.members.filter(m=>due(g,m)>0).length;return `<div class="card" data-a="open" data-id="${g.id}" tabindex="0">
    <div class="head"><h2>${esc(g.name)}</h2><span class="badge ${g.type=='tontine'?'t':''}">${g.type=='tontine'?'Tontine':'Association'}</span></div>
    <small>${g.members.length} membres, ${f(g.amount)} par ${g.freq}</small><br>
    <small>${f(coll(g))} collectés</small> ${l?`<span class="badge late">${l} en retard</span>`:''}</div>`}).join('')
  :'<p class="empty">Aucun groupe pour l’instant. Créez votre première tontine ou association.</p>'}
  <footer>Vos données restent dans ce navigateur. Faites une sauvegarde régulière pour ne rien perdre.<br><br>
  <button class="ghost sm" data-a="backup">Sauvegarder mes données</button> <button class="ghost sm" data-a="restore">Restaurer une sauvegarde</button></footer>`;
}

function group(g){
  const tabs=[['membres','Membres'],['paiements','Paiements'],[g.type=='tontine'?'tour':'caisse',g.type=='tontine'?'Tours':'Caisse'],['plus','Plus']];
  return `<button class="ghost sm" data-a="home">Retour</button>
  <div class="head" style="margin-top:10px"><div><h1 style="font-size:28px;margin:0">${esc(g.name)}</h1>
  <span class="mut">${f(g.amount)} par ${g.freq}, depuis le ${dfr(g.start)}</span></div>
  <span class="badge ${g.type=='tontine'?'t':''}">${g.type=='tontine'?'Tontine':'Association'}</span></div>
  <div class="tabs" role="tablist">${tabs.map(t=>`<button class="${tab==t[0]?'on':''}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${({membres,paiements,tour,caisse,plus})[tab](g)}`;
}

function membres(g){
  const ms=[...g.members].sort((a,b)=>due(g,b)-due(g,a)),late=ms.filter(m=>due(g,m)>0).length;
  return `<div class="sum"><div><b>${g.members.length}</b>membres</div><div><b>${f(coll(g))}</b>collectés</div><div><b>${late}</b>en retard</div></div>
  <button data-a="addm">Ajouter un membre</button>
  ${ms.length?ms.map(m=>{const d=due(g,m);return `<div class="row2"><div class="grow"><b>${esc(m.name)}</b> ${g.type=='asso'&&m.role!='Membre'?`<em>${esc(m.role)}</em>`:''}<br>
  <small class="mut">${esc(m.phone||'Pas de numéro')}</small></div>
  <span class="badge ${d>0?'late':''}">${d>0?'Reste '+f(d):d<0?'Avance '+f(-d):'À jour'}</span>
  <div class="acts"><button class="sm" data-a="pay" data-id="${m.id}">Payer</button>
  ${d>0&&m.phone?`<button class="sm ghost" data-a="remind" data-id="${m.id}">Relancer</button>`:''}
  <button class="sm ghost" data-a="editm" data-id="${m.id}" aria-label="Modifier">Modifier</button>
  <button class="sm ghost" data-a="delm" data-id="${m.id}" aria-label="Supprimer">Retirer</button></div></div>`}).join('')
  :'<p class="empty">Aucun membre. Ajoutez le premier pour commencer.</p>'}`;
}

function paiements(g){
  const ps=[...g.payments].sort((a,b)=>b.date.localeCompare(a.date));
  return `<button data-a="pay">Enregistrer un paiement</button>
  ${ps.length?ps.map(p=>{const m=mem(g,p.mid)||{name:'Ancien membre'};return `<div class="row2"><div class="grow"><b>${esc(m.name)}</b><br>
  <small class="mut">${dfr(p.date)}, ${esc(p.method)}${p.note?', '+esc(p.note):''}</small></div><b>${f(p.amount)}</b>
  <div class="acts">${m.phone?`<button class="sm ghost" data-a="rcpt" data-id="${p.id}">Envoyer le reçu</button>`:''}
  <button class="sm ghost" data-a="delp" data-id="${p.id}">Annuler</button></div></div>`}).join('')
  :'<p class="empty">Aucun paiement enregistré.</p>'}`;
}

function tour(g){
  const o=ord(g),n=o.length;
  if(!n)return '<p class="empty">Ajoutez des membres pour organiser les tours.</p>';
  const nx=mem(g,o[g.round%n]),unpaid=g.members.filter(m=>due(g,m)>0).length,cyc=Math.floor(g.round/n)*n;
  return `<div class="pot"><span>Cagnotte du tour ${g.round+1}</span><b>${f(g.amount*n)}</b>
  <p style="margin:4px 0">À remettre à <strong>${esc(nx.name)}</strong>.${unpaid?` ${unpaid} membre(s) n’ont pas tout payé.`:' Tout le monde est à jour.'}</p>
  <button data-a="tourok">Valider la remise</button></div>
  <h3>Ordre de passage</h3><button class="ghost sm" data-a="shuffle">Tirage au sort</button>
  ${o.map((id,i)=>{const m=mem(g,id),got=g.tours.some(t=>t.mid==id&&t.round>=cyc);return `<div class="row2"><span class="rk">${i+1}</span>
  <span class="grow">${esc(m.name)} ${i==g.round%n?'<em>prochain</em>':''} ${got?'<span class="badge">a reçu</span>':''}</span>
  <div class="acts"><button class="sm ghost" data-a="up" data-id="${id}" aria-label="Monter">Monter</button><button class="sm ghost" data-a="down" data-id="${id}" aria-label="Descendre">Descendre</button></div></div>`}).join('')}
  <h3>Remises effectuées</h3>
  ${g.tours.length?[...g.tours].reverse().map(t=>`<div class="row2"><span class="grow"><b>${esc((mem(g,t.mid)||{name:'Ancien membre'}).name)}</b><br><small class="mut">Tour ${t.round+1}, ${dfr(t.date)}</small></span><b>${f(t.amt)}</b></div>`).join(''):'<p class="mut">Aucune remise pour l’instant.</p>'}`;
}

function caisse(g){
  const dep=g.expenses.reduce((s,e)=>s+e.amount,0);
  return `<div class="sum"><div><b>${f(coll(g))}</b>entrées</div><div><b>${f(dep)}</b>dépenses</div><div><b>${f(coll(g)-dep)}</b>solde en caisse</div></div>
  <button data-a="addx">Ajouter une dépense</button>
  ${g.expenses.length?[...g.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="row2"><span class="grow"><b>${esc(e.label)}</b><br><small class="mut">${dfr(e.date)}</small></span><b>${f(e.amount)}</b>
  <button class="sm ghost" data-a="delx" data-id="${e.id}">Supprimer</button></div>`).join(''):'<p class="empty">Aucune dépense enregistrée.</p>'}`;
}

function plus(g){
  return `<h3>Rapports</h3><div class="acts"><button class="ghost" data-a="csv">Exporter les paiements (Excel)</button><button class="ghost" data-a="print">Imprimer le rapport</button></div>
  <h3>Modifier le groupe</h3><div class="acts"><button class="ghost" data-a="editg">Changer le nom ou le montant</button><button class="red" data-a="delg">Supprimer le groupe</button></div>`;
}

function render(){
  const g=cur&&G();if(cur&&!g)cur=null;
  $('#app').innerHTML=g?group(g):home();
  $('#sub').textContent=g?'':'Tontines et associations';
  window.scrollTo(0,0);
}

/* ---------- Actions ---------- */
const FQ=[['mois','Chaque mois'],['semaine','Chaque semaine'],['an','Chaque année']];
const MD=['Wave','Orange Money','Espèces','Autre'].map(x=>[x,x]);
const A={
  home(){cur=null;render()},
  open(id){cur=id;tab='membres';render()},
  tab(id){tab=id;render()},
  newg(){modal('Nouveau groupe',[
    {k:'name',l:'Nom du groupe',p:'Tontine des voisins'},
    {k:'type',l:'Type',t:'select',o:[['tontine','Tontine (cagnotte qui tourne)'],['asso','Association ou club (caisse commune)']]},
    {k:'amount',l:'Cotisation (FCFA)',t:'number',p:'5000'},
    {k:'freq',l:'Fréquence',t:'select',o:FQ,v:'mois'},
    {k:'start',l:'Date de début',t:'date',v:today()}],v=>{
    if(!v.name||!(+v.amount>0)){toast('Indiquez un nom et un montant.');return false}
    const g={id:uid(),name:v.name,type:v.type,amount:+v.amount,freq:v.freq,start:v.start||today(),members:[],payments:[],expenses:[],tours:[],round:0,order:[]};
    S.groups.push(g);save();cur=g.id;tab='membres';render()})},
  editg(){const g=G();modal('Modifier le groupe',[{k:'name',l:'Nom',v:g.name},{k:'amount',l:'Cotisation (FCFA)',t:'number',v:g.amount}],v=>{
    if(!v.name||!(+v.amount>0)){toast('Nom et montant requis.');return false}
    g.name=v.name;g.amount=+v.amount;save();render()})},
  delg(){if(confirm('Supprimer ce groupe et tout son historique ?')){S.groups=S.groups.filter(x=>x.id!=cur);cur=null;save();render()}},
  addm(){const g=G();modal('Nouveau membre',[{k:'name',l:'Nom complet'},{k:'phone',l:'Téléphone (WhatsApp)',t:'tel',p:'77 123 45 67'}]
    .concat(g.type=='asso'?[{k:'role',l:'Rôle',t:'select',o:['Membre','Président(e)','Trésorier(ère)','Secrétaire'].map(x=>[x,x])}]:[]),v=>{
    if(!v.name){toast('Indiquez un nom.');return false}
    g.members.push({id:uid(),name:v.name,phone:v.phone,role:v.role||'Membre'});save();render()})},
  editm(id){const g=G(),m=mem(g,id);modal('Modifier le membre',[{k:'name',l:'Nom',v:m.name},{k:'phone',l:'Téléphone',t:'tel',v:m.phone}]
    .concat(g.type=='asso'?[{k:'role',l:'Rôle',t:'select',v:m.role,o:['Membre','Président(e)','Trésorier(ère)','Secrétaire'].map(x=>[x,x])}]:[]),v=>{
    if(!v.name){toast('Indiquez un nom.');return false}
    Object.assign(m,{name:v.name,phone:v.phone,role:v.role||m.role});save();render()})},
  delm(id){const g=G();if(confirm('Retirer ce membre ? Ses paiements restent dans l’historique.')){g.members=g.members.filter(m=>m.id!=id);save();render()}},
  pay(id){const g=G();if(!g.members.length){toast('Ajoutez d’abord un membre.');return}
    const m0=id?mem(g,id):g.members[0],d=Math.max(0,due(g,m0))||g.amount;
    modal('Enregistrer un paiement',[{k:'mid',l:'Membre',t:'select',v:m0.id,o:g.members.map(m=>[m.id,esc(m.name)])},
    {k:'amount',l:'Montant (FCFA)',t:'number',v:d},{k:'date',l:'Date',t:'date',v:today()},{k:'method',l:'Mode de paiement',t:'select',o:MD},{k:'note',l:'Note (facultatif)'}],v=>{
    if(!(+v.amount>0)){toast('Indiquez un montant.');return false}
    g.payments.push({id:uid(),mid:v.mid,amount:+v.amount,date:v.date||today(),method:v.method,note:v.note});save();render();toast('Paiement enregistré.')})},
  delp(id){if(confirm('Annuler ce paiement ?')){const g=G();g.payments=g.payments.filter(p=>p.id!=id);save();render()}},
  rcpt(id){const g=G(),p=g.payments.find(x=>x.id==id),m=mem(g,p.mid);
    window.open(wa(m.phone,`Reçu ${g.name}\n${m.name} a payé ${f(p.amount)} le ${dfr(p.date)} (${p.method}).\n${due(g,m)>0?'Reste à payer : '+f(due(g,m)):'Vous êtes à jour.'}\nMerci !`),'_blank')},
  remind(id){const g=G(),m=mem(g,id);
    window.open(wa(m.phone,`Bonjour ${m.name}, petit rappel pour ${g.name} : il vous reste ${f(due(g,m))} à régler (${f(g.amount)} par ${g.freq}). Paiement par Wave, Orange Money ou espèces. Merci !`),'_blank')},
  up(id){const o=ord(G()),i=o.indexOf(id);if(i>0){[o[i-1],o[i]]=[o[i],o[i-1]];save();render()}},
  down(id){const o=ord(G()),i=o.indexOf(id);if(i<o.length-1){[o[i+1],o[i]]=[o[i],o[i+1]];save();render()}},
  shuffle(){const g=G(),o=ord(g);if(g.round>0&&!confirm('Le cycle a déjà commencé. Mélanger quand même l’ordre ?'))return;
    for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}save();render();toast('Ordre tiré au sort.')},
  tourok(){const g=G(),o=ord(g),m=mem(g,o[g.round%o.length]);
    if(confirm(`Confirmer la remise de ${f(g.amount*o.length)} à ${m.name} ?`)){g.tours.push({mid:m.id,date:today(),amt:g.amount*o.length,round:g.round});g.round++;save();render();toast('Remise enregistrée.')}},
  addx(){const g=G();modal('Nouvelle dépense',[{k:'label',l:'Motif',p:'Location de salle'},{k:'amount',l:'Montant (FCFA)',t:'number'},{k:'date',l:'Date',t:'date',v:today()}],v=>{
    if(!v.label||!(+v.amount>0)){toast('Motif et montant requis.');return false}
    g.expenses.push({id:uid(),label:v.label,amount:+v.amount,date:v.date||today()});save();render()})},
  delx(id){const g=G();g.expenses=g.expenses.filter(e=>e.id!=id);save();render()},
  csv(){const g=G(),rows=[['Date','Membre','Montant','Mode','Note']].concat([...g.payments].sort((a,b)=>a.date.localeCompare(b.date)).map(p=>[p.date,(mem(g,p.mid)||{name:'Ancien membre'}).name,p.amount,p.method,p.note||'']));
    dl(g.name.replace(/\W+/g,'-')+'-paiements.csv','\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')},
  print(){tab='membres';render();window.print()},
  backup(){dl('mbootaay-sauvegarde-'+today()+'.json',JSON.stringify(S),'application/json')},
  restore(){$('#file').click()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id)});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('[data-a][tabindex]')){e.preventDefault();e.target.click()}});
$('#file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.groups))throw 0;
  if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){S=d;save();cur=null;render();toast('Sauvegarde restaurée.')}}catch(x){toast('Fichier de sauvegarde invalide.')}};
  if(e.target.files[0])r.readAsText(e.target.files[0]);e.target.value=''};
render();
</script>
